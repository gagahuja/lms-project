<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>ScoreSkill - Something Went Wrong</title>

    <style>

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #f8fafc;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            color: #172033;
        }

        .error-card {

            width: min(560px, 90%);

            background: white;

            border: 1px solid #e2e8f0;

            border-radius: 18px;

            padding: 44px 36px;

            text-align: center;

            box-shadow:
                0 12px 30px
                rgba(15, 23, 42, 0.08);
        }

        .logo {

            width: 72px;

            margin-bottom: 15px;
        }

        .error-icon {

            font-size: 54px;

            margin-bottom: 10px;
        }

        h1 {

            margin: 0 0 12px;

            font-size: 28px;

        }

        p {

            margin: 8px 0;

            color: #64748b;

            line-height: 1.6;

            font-size: 14px;
        }

        .home-button {

            display: inline-block;

            margin-top: 22px;

            padding: 11px 20px;

            border-radius: 9px;

            background:
                linear-gradient(
                    135deg,
                    #6366f1,
                    #4f46e5
                );

            color: white;

            text-decoration: none;

            font-weight: 600;

            font-size: 14px;
        }

        .home-button:hover {

            opacity: 0.92;

        }

        .footer {

            margin-top: 24px;

            font-size: 12px;

            color: #94a3b8;

        }

    </style>

</head>

<body>

    <div class="error-card">

        {% load static %}

        <img
            src="{% static 'scoreskill_logo.png' %}"
            alt="ScoreSkill"
            class="logo"
        >

        <div class="error-icon">
            ⚠️
        </div>

        <h1>
            Something went wrong
        </h1>

        <p>
            We couldn't complete your request right now.
        </p>

        <p>
            Please try again in a moment.
        </p>

        <a
            href="{% url 'dashboard' %}"
            class="home-button"
        >
            ← Back to Dashboard
        </a>

        <div class="footer">
            ScoreSkill - Smart Learning Platform
        </div>

    </div>

</body>
</html>
