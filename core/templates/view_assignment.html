{% extends 'base.html' %}
{% load static %}

{% block content %}

<style>

#pdf-container{
    position:relative;
    text-align:center;
}

#pdf-canvas{
    border:1px solid #ddd;
    max-width:100%;
}

#pdf-container{
    text-align:center;
}

#pdf-container canvas{
    max-width:100%;
    border:1px solid #ddd;
    margin-bottom:20px;
}

.watermark{
    position:absolute;
    top:100px;
    left:100px;
    font-size:40px;
    opacity:0.15;
    transform:rotate(-30deg);
    pointer-events:none;
    z-index:9999;
    color:#000;
}

body{
    user-select:none;
    -webkit-user-select:none;
    -moz-user-select:none;
}

</style>

<h3>{{ assignment.title }}</h3>

<!-- 🔒 SECURE VIEW -->
<div id="pdf-container">

    <!-- <div class="watermark">
        {{ request.user.username }}
        {{ request.user.email }}
        {{ now|date:"d M Y H:i" }}
    </div> -->

    <!-- <div id="pdf-container"></div> -->

</div>

<hr>

<h5>📤 Submit Your Solution</h5>

<form method="POST" enctype="multipart/form-data">
    {% csrf_token %}

    <input type="file" name="file" class="form-control" required>

    <button class="btn btn-success mt-2">
        Submit Assignment
    </button>
</form>

<script>
const watermarkText =
`{{ watermark_text|escapejs }}`;
</script>

<script src="{% static 'pdfjs/pdf.js' %}"></script>

<script>

pdfjsLib.GlobalWorkerOptions.workerSrc =
"{% static 'pdfjs/pdf.worker.js' %}";

const url = "{{ assignment.file.url }}";

pdfjsLib.getDocument(url).promise.then(function(pdf){

    const container =
        document.getElementById("pdf-container");

    for(let pageNumber = 1;
        pageNumber <= pdf.numPages;
        pageNumber++){

        pdf.getPage(pageNumber).then(function(page){

            const scale = 1.5;

            const viewport =
                page.getViewport({ scale });

            const canvas =
                document.createElement("canvas");

            canvas.style.marginBottom = "20px";

            const context =
                canvas.getContext("2d");

            canvas.height =
                viewport.height;

            canvas.width =
                viewport.width;

            container.appendChild(canvas);

            page.render({
                canvasContext: context,
                viewport: viewport
            }).promise.then(function(){

                addWatermark(
                    context,
                    viewport.width,
                    viewport.height,
                    watermarkText
                );

            });

        });

    }

});



function addWatermark(
    ctx,
    width,
    height,
    text
){

    ctx.save();

    ctx.globalAlpha = 0.10;
    ctx.fillStyle = "red";
    ctx.font = "bold 28px Arial";
    ctx.textAlign = "center";

    const lines =
        text.split("\n");

    for(let x = 150; x < width; x += 250){

        for(let y = 150; y < height; y += 250){

            ctx.save();

            ctx.translate(x,y);

            ctx.rotate(
                -45 * Math.PI / 180
            );

            let offset = 0;

            lines.forEach(function(line){

                ctx.fillText(
                    line,
                    0,
                    offset
                );

                offset += 30;

            });

            ctx.restore();
        }
    }

    ctx.restore();
}

</script>

<script>
document.addEventListener(
    'contextmenu',
    function(e){
        e.preventDefault();
    }
);
</script>

<script>

document.addEventListener(
'keydown',
function(e){

    if(
        e.ctrlKey &&
        (
            e.key === 's' ||
            e.key === 'p' ||
            e.key === 'u'
        )
    ){
        e.preventDefault();
    }

    if(
        e.ctrlKey &&
        e.shiftKey &&
        (
            e.key === 'I' ||
            e.key === 'J' ||
            e.key === 'C'
        )
    ){
        e.preventDefault();
    }

    if(e.key === 'PrintScreen'){
        e.preventDefault();
    }

});

</script>



<script>

document.addEventListener(
'visibilitychange',
function(){

    const pdf =
        document.getElementById(
            'pdf-container'
        );

    if(document.hidden){
        pdf.style.filter =
            'blur(25px)';
    }
    else{
        pdf.style.filter =
            'none';
    }

});

</script>



{% endblock %}
