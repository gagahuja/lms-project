{% extends 'base.html' %}

{% block content %}

<style>
    .ai-quiz-page {
        max-width: 900px;
        margin: 40px auto;
        padding: 0 20px;
    }

    .ai-quiz-header {
        background: linear-gradient(135deg, #5b5ce2, #8b5cf6);
        color: white;
        border-radius: 18px;
        padding: 30px;
        margin-bottom: 25px;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
    }

    .ai-quiz-header h1 {
        margin: 0 0 8px;
        font-size: 30px;
        font-weight: 700;
    }

    .ai-quiz-header p {
        margin: 0;
        opacity: 0.9;
        font-size: 15px;
    }

    .ai-quiz-card {
        background: white;
        border: 1px solid #e5e7eb;
        border-radius: 18px;
        padding: 30px;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.06);
    }

    .course-badge {
        display: inline-block;
        background: #eef2ff;
        color: #4f46e5;
        padding: 7px 12px;
        border-radius: 20px;
        font-size: 13px;
        font-weight: 600;
        margin-bottom: 20px;
    }

    .topic-label {
        display: block;
        font-weight: 600;
        margin-bottom: 8px;
        color: #1f2937;
    }

    .topic-input {
        width: 100%;
        box-sizing: border-box;
        padding: 14px 16px;
        border: 1px solid #d1d5db;
        border-radius: 10px;
        font-size: 16px;
        outline: none;
        transition: 0.2s;
    }

    .topic-input:focus {
        border-color: #6366f1;
        box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.12);
    }

    .generate-btn {
        margin-top: 20px;
        width: 100%;
        padding: 14px 20px;
        border: none;
        border-radius: 10px;
        background: #4f46e5;
        color: white;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: 0.2s;
    }

    .generate-btn:hover {
        background: #4338ca;
        transform: translateY(-1px);
    }

    .quiz-info {
        margin-top: 20px;
        padding: 15px;
        background: #f8fafc;
        border-radius: 10px;
        color: #64748b;
        font-size: 14px;
    }

    @media (max-width: 600px) {
        .ai-quiz-page {
            margin: 20px auto;
            padding: 0 12px;
        }

        .ai-quiz-header,
        .ai-quiz-card {
            padding: 20px;
        }

        .ai-quiz-header h1 {
            font-size: 24px;
        }
    }
</style>


<div class="ai-quiz-page">

    <!-- Header -->

    <div class="ai-quiz-header">

        <h1>🤖 Generate AI Quiz</h1>

        <p>
            Create a personalised quiz using ScoreSkill AI.
        </p>

    </div>


    <!-- Quiz Generator -->

    <div class="ai-quiz-card">

        <span class="course-badge">
            📘 {{ course.title }}
        </span>

        <form method="POST">

            {% csrf_token %}

            <label for="topic" class="topic-label">
                Quiz Topic
            </label>

            <input
                type="text"
                id="topic"
                name="topic"
                class="topic-input"
                placeholder="Example: HCF, Real Numbers, Polynomials..."
                autocomplete="off"
                required
            >

            <button
                type="submit"
                class="generate-btn">

                ✨ Generate Quiz

            </button>

        </form>


        <div class="quiz-info">

            💡 <strong>Tip:</strong>
            Enter a specific topic to get better questions.
            For example, try <strong>HCF</strong> or
            <strong>Real Numbers</strong>.

        </div>

    </div>

</div>

{% endblock %}
