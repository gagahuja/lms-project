{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

<h3>🎥 Upload Recording</h3>

<div class="card p-4">

<h5>{{ class_obj.title }}</h5>

<p>{{ class_obj.date }}</p>

{% if recording %}
<div class="alert alert-success">

Current Recording Available

</div>
{% endif %}

<form method="POST" enctype="multipart/form-data">

{% csrf_token %}

<div class="mb-3">

<label>Select Video</label>

    <input
        type="file"
        name="video"
        accept=".mp4,.webm,video/mp4,video/webm"
        class="form-control"
        required>

    <div class="form-text">
        MP4 or WebM only. Maximum size: 10 MB.
    </div>

</div>

<button class="btn btn-primary">

{% if recording %}
Replace Recording
{% else %}
Upload Recording
{% endif %}

</button>

</form>

</div>

</div>

{% endblock %}
