{% extends "base.html" %}

{% block content %}

<div class="container py-4">

    <div class="card shadow-sm">

        <div class="card-body">

            <div class="d-flex justify-content-between align-items-start gap-3 mb-3">

                <div>

                    <h3 class="mb-1">
                        {{ recording.title }}
                    </h3>

                    <div class="text-muted">
                        {{ module.title }}
                    </div>

                </div>

            </div>


            {% if recording.description %}

                <div class="text-muted mb-4">
                    {{ recording.description }}
                </div>

            {% endif %}


            <div
                id="recording-status"
                class="alert alert-info"
            >
                Preparing video...
            </div>


            <div
                id="recording-player-container"
                style="
                    display:none;
                    user-select:none;
                    -webkit-user-select:none;
                "
            >

                <video
                    id="module-recording-player"
                    controls
                    controlsList="nodownload noplaybackrate"
                    disablePictureInPicture
                    playsinline
                    preload="metadata"
                    style="
                        width:100%;
                        max-height:70vh;
                        background:#000;
                        border-radius:10px;
                    "
                >
                </video>

            </div>

        </div>

    </div>

</div>


<!-- =========================================================
     SECURE VIDEO LOADING
     ========================================================= -->

<script>

(function () {

    const status =
        document.getElementById(
            "recording-status"
        );

    const container =
        document.getElementById(
            "recording-player-container"
        );

    const video =
        document.getElementById(
            "module-recording-player"
        );



    const videoUrl =
        "{% url 'serve_module_recording' recording.id %}";

    // Native video requests automatically include the same-origin
    // session cookie and can send HTTP Range headers for seeking.
    video.addEventListener(
        "loadeddata",
        function () {
            status.style.display = "none";
        },
        { once: true }
    );

    video.addEventListener(
        "error",
        function () {
            status.className = "alert alert-danger";
            status.textContent = "Unable to load the recording.";
        }
    );

    status.className = "alert alert-info";
    status.textContent = "Loading recording...";

    container.style.display = "block";

    video.src = videoUrl;
    video.load();

    // RIGHT-CLICK
    // ---------------------------------------------------------

    document.addEventListener(
        "contextmenu",
        function (event) {

            event.preventDefault();

        }
    );


    // ---------------------------------------------------------
    // TEXT SELECTION
    // ---------------------------------------------------------

    document.addEventListener(
        "selectstart",
        function (event) {

            event.preventDefault();

        }
    );


    // ---------------------------------------------------------
    // DRAG
    // ---------------------------------------------------------

    document.addEventListener(
        "dragstart",
        function (event) {

            event.preventDefault();

        }
    );


    // ---------------------------------------------------------
    // KEYBOARD DETERRENTS
    // ---------------------------------------------------------

    document.addEventListener(
        "keydown",
        function (event) {

            const key =
                event.key.toLowerCase();


            // Ctrl + S / P / U

            if (
                event.ctrlKey &&
                (
                    key === "s" ||
                    key === "p" ||
                    key === "u"
                )
            ) {

                event.preventDefault();

                return;

            }


            // Ctrl + Shift + I / J / C

            if (
                event.ctrlKey &&
                event.shiftKey &&
                (
                    key === "i" ||
                    key === "j" ||
                    key === "c"
                )
            ) {

                event.preventDefault();

                return;

            }


            // PrintScreen

            if (
                event.key === "PrintScreen"
            ) {

                event.preventDefault();

            }

        }
    );


    // ---------------------------------------------------------
    // TAB / WINDOW SWITCH BLUR
    // ---------------------------------------------------------

    document.addEventListener(
        "visibilitychange",
        function () {

            if (
                document.hidden
            ) {

                video.style.filter =
                    "blur(25px)";

            }
            else {

                video.style.filter =
                    "none";

            }

        }
    );


})();

</script>

{% endblock %}
