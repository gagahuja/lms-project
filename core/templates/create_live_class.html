{% extends 'base.html' %}
{% block content %}

<div class="container mt-4">

    <div class="card shadow-sm p-4">

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-info">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

    <h2>Create Live Class</h2>
        <h2 class="mb-4 fw-bold">Create Live Class</h2>

        <form method="POST">
            {% csrf_token %}

            <!-- Class Title -->
            <div class="mb-3">
                <label class="form-label fw-semibold">
                    Class Title
                </label>
                <input 
                    type="text"
                    name="title"
                    class="form-control"
                    placeholder="Enter Class Title"
                    required
                >
            </div>

            <!-- Course Dropdown -->
            <div class="mb-3">
                <label class="form-label fw-semibold">
                    Select Course
                </label>

                <select 
                    name="course"
                    class="form-control"
                    required
                >
                    <option value="">
                        Select Course
                    </option>

                    {% for course in courses %}
                        <option value="{{ course.id }}">
                            {{ course.title }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <!-- Group / Batch Dropdown -->
            <div class="mb-3">
                <label class="form-label fw-semibold">
                    Select Group / Batch (Optional)
                </label>

                <select
                    name="group"
                    id="liveClassGroup"
                    class="form-control"
                >
                    <option value="">
                        Course-wide Class (All Enrolled Students)
                    </option>

                    {% for group in groups %}
                        <option
                            value="{{ group.id }}"
                            data-course-id="{{ group.course_id }}"
                        >
                            {{ group.course.title }} — {{ group.name }}
                        </option>
                    {% endfor %}
                </select>

                <small class="text-muted">
                    Leave this blank for a class available to all enrolled students.
                </small>
            </div>

            <!-- Date & Time -->
            <div class="mb-3">
                <label class="form-label fw-semibold">
                    Class Date & Time
                </label>

                <input 
                    type="datetime-local"
                    name="date"
                    class="form-control"
                    required
                >
            </div>

            <!-- Meeting Link -->
            <div class="mb-3">
                <label class="form-label fw-semibold">
                    Google Meet / Zoom Link
                </label>

                <input 
                    type="url"
                    name="meeting_link"
                    class="form-control"
                    placeholder="https://meet.google.com/..."
                    required
                >
            </div>

            <!-- Whiteboard Link -->
            <div class="mb-3">
                <label class="form-label fw-semibold">
                    Whiteboard Link (Optional)
                </label>

                <input 
                    type="url"
                    name="whiteboard"
                    class="form-control"
                    placeholder="https://whiteboard-link.com"
                >
            </div>

            <!-- Button -->
            <button type="submit" class="btn btn-success px-4">
                Create Class
            </button>

        </form>
    </div>
</div>


<script>
document.addEventListener("DOMContentLoaded", function () {
    const courseSelect = document.querySelector(
        'select[name="course"]'
    );

    const groupSelect = document.getElementById(
        "liveClassGroup"
    );

    if (!courseSelect || !groupSelect) return;

    function filterGroups() {
        const selectedCourseId = courseSelect.value;

        Array.from(groupSelect.options).forEach(option => {
            if (!option.dataset.courseId) {
                option.hidden = false;
                option.disabled = false;
                return;
            }

            const matchesCourse =
                selectedCourseId &&
                option.dataset.courseId === selectedCourseId;

            option.hidden = !matchesCourse;
            option.disabled = !matchesCourse;
        });

        const selectedOption = groupSelect.selectedOptions[0];

        if (
            selectedOption &&
            selectedOption.dataset.courseId &&
            selectedOption.dataset.courseId !== selectedCourseId
        ) {
            groupSelect.value = "";
        }
    }

    courseSelect.addEventListener("change", filterGroups);
    filterGroups();
});
</script>

{% endblock %}
