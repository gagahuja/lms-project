{% extends 'base.html' %}
{% block content %}

<div class="container mt-4">

    <div class="card shadow-sm p-4">

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-info">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

    <h2>Create Live Class</h2>
        <h2 class="mb-4 fw-bold">Create Live Class</h2>

        <form method="POST">
            {% csrf_token %}

            <!-- Class Title -->
            <div class="mb-3">
                <label class="form-label fw-semibold">
                    Class Title
                </label>
                <input 
                    type="text"
                    name="title"
                    class="form-control"
                    placeholder="Enter Class Title"
                    required
                >
            </div>

            <!-- Course Dropdown -->
            <div class="mb-3">
                <label class="form-label fw-semibold">
                    Select Course
                </label>

                <select 
                    name="course"
                    class="form-control"
                    required
                >
                    <option value="">
                        Select Course
                    </option>

                    {% for course in courses %}
                        <option value="{{ course.id }}">
                            {{ course.title }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <!-- Date & Time -->
            <div class="mb-3">
                <label class="form-label fw-semibold">
                    Class Date & Time
                </label>

                <input 
                    type="datetime-local"
                    name="date"
                    class="form-control"
                    required
                >
            </div>

            <!-- Meeting Link -->
            <div class="mb-3">
                <label class="form-label fw-semibold">
                    Google Meet / Zoom Link
                </label>

                <input 
                    type="url"
                    name="meeting_link"
                    class="form-control"
                    placeholder="https://meet.google.com/..."
                    required
                >
            </div>

            <!-- Whiteboard Link -->
            <div class="mb-3">
                <label class="form-label fw-semibold">
                    Whiteboard Link (Optional)
                </label>

                <input 
                    type="url"
                    name="whiteboard"
                    class="form-control"
                    placeholder="https://whiteboard-link.com"
                >
            </div>

            <!-- Button -->
            <button type="submit" class="btn btn-success px-4">
                Create Class
            </button>

        </form>
    </div>
</div>

{% endblock %}
